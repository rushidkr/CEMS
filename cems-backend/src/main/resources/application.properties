# ===================== SERVER =====================
server.port=8080
server.servlet.context-path=/api

# ===================== DATABASE =====================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/cems_db;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

# ===================== JPA / HIBERNATE =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================== JWT =====================
# Plain string secret (>=32 chars), encoded to bytes directly - not Base64 input
cems.jwt.secret=ChangeThisCemsSecretKeyToSomethingLongAndRandom2026!!
cems.jwt.expiration-ms=86400000
cems.jwt.refresh-expiration-ms=604800000

# ===================== MAIL (for notifications) =====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
cems.mail.enabled=false

# ===================== FILE UPLOAD =====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
cems.upload.dir=uploads/

# ===================== CORS =====================
cems.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ===================== LOGGING =====================
logging.level.com.cems=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===================== SWAGGER =====================
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/swagger-ui.html
